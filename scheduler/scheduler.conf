# ──────────────────────────────────────────────────────────────
# scheduler.conf — settings for the cron-driven jobs
#
# WHEN a job runs is decided by crontab (see crontab.example),
# NOT here. This file only decides whether a job is allowed to
# do anything when cron wakes it, plus how it reaches the
# database. That split is deliberate: an operator can disable a
# job by editing one line here without touching root's crontab,
# and the schedule itself lives where every other scheduled job
# on the box lives.
#
# Changes take effect on the very next run — nothing to restart,
# because each run is a fresh process.
# ──────────────────────────────────────────────────────────────

[scheduler]
# Master kill switch. false = every job below exits immediately
# without touching the database. Useful during a migration or an
# incident, when you want the cron entries left in place.
enabled = true


[rent_bill_generation]
# On/off for this specific job. Only consulted when [scheduler]
# enabled = true above.
enabled = true

# IANA timezone used to decide WHICH DAY the run is for. This is
# not the schedule — it answers "what is today?" when the job
# picks up tenants whose rent_bill_date matches. Keep it aligned
# with the app's own timezone or a run near midnight can bill for
# the wrong day.
timezone = Asia/Kolkata


[database]
# How this cron process reaches the database.
#
# Precedence, highest first:
#   1. the DATABASE_URL environment variable
#   2. the `url` value below, if set
#   3. host/port/name/user/password below
#   4. the DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD env vars
#   5. the same defaults the application uses
#
# Cron runs with a nearly empty environment, so unless the crontab
# entry sources an env file, filling these in is usually the most
# reliable option. Keep this file readable only by the user the
# job runs as — it can hold a database password.
url      =
host     =
port     =
name     =
user     =
password =
