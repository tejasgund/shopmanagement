[pytest]
# The application's suite. The scheduler has its own, in its own folder, run
# separately because it deliberately configures a different database and log
# directory through the environment:
#
#     pytest                    # this app  (247 tests)
#     pytest scheduler          # the scheduler, standalone (41 tests)
#
# Keeping them apart is part of the separation: the scheduler's suite must
# pass on a machine where this application is not installed at all.
testpaths = tests
