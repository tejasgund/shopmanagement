# ──────────────────────────────────────────────────────────────
# scheduler.conf — background job scheduler settings
#
# Edit values here to change when scheduled jobs run, or to turn
# them on/off, without touching app.py.
#
# Changes take effect on the next app restart (the scheduler is
# configured once at startup).
# ──────────────────────────────────────────────────────────────

[scheduler]
# Master on/off switch. If false, NO background jobs run at all,
# regardless of the individual job settings below.
enabled = true


[rent_bill_generation]
# On/off switch for this specific job.
# (Only takes effect if [scheduler] enabled = true above.)
enabled = true

# When the job runs, expressed as APScheduler cron fields.
# Use * for "every" (e.g. day = * means every day of the month).
# Examples:
#   hour = 11, minute = 0                 -> once a day at 11:00
#   hour = */6, minute = 0               -> every 6 hours
#   day_of_week = mon-fri, hour=9        -> weekdays at 09:00
minute      = 22
hour        = 21
day         = *
month       = *
day_of_week = *

# IANA timezone the schedule above is evaluated in.
timezone = Asia/Kolkata

# If the app was down when a run was due, how many seconds late
# it's still allowed to fire before being skipped entirely.
misfire_grace_time = 3600
