# ──────────────────────────────────────────────────────────────
# scheduler.conf — the ONE config file for every scheduler script.
#
# It answers three questions and no others: how to reach the
# database, what timezone the schedule is in, and where to write
# the logs. Everything else the scheduler needs, it reads FROM
# the database once connected.
#
# In particular the on/off switches are NOT here. They live in
# the Scheduler settings screen so they can be changed without
# shell access to this box, and so the dashboard shows the same
# values the scripts obey. An `enabled = false` in a file on the
# server and a toggle in the UI would be two answers to the same
# question, and whichever the operator checked first would be the
# wrong one.
#
# WHEN each task runs is crontab's business — see crontab.example.
#
# Every value can also come from the environment (shown against
# each key below), which wins over this file. Changes take effect
# on the next run; nothing to restart, because every run is a
# fresh process.
# ──────────────────────────────────────────────────────────────

[database]
# Precedence, highest first:
#   1. the DATABASE_URL environment variable
#   2. the `url` value below, if set
#   3. the DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD env vars
#   4. the host/port/name/user/password values below
#   5. the scheduler's built-in fallbacks (localhost/tenant_management)
#
# Cron runs with a nearly empty environment, so unless the crontab
# entry sources an env file, filling these in is usually the most
# reliable option. Keep this file readable only by the user the
# job runs as — it can hold a database password:
#     chmod 600 scheduler.conf
url      =
host     =
port     =
name     =
user     =
password =

[scheduler]
# The timezone every scheduled time is interpreted in, and the one
# the ledger's timestamps are written in.
#
# This MUST match the timezone the application stores its
# timestamps in (its APP_TIMEZONE), or a task scheduled for 02:00
# will appear to have run at the wrong hour on the dashboard. It is
# configured here rather than read from the app so the two stay
# independently deployable — the price is that changing one means
# changing the other.
#
# Environment: SCHEDULER_TIMEZONE
timezone = Asia/Kolkata

[logging]
# One file per task, written here:
#     rent_generation.log      due_date_penalty.log
#     future_task_checker.log  master.log
#     errors.log               ERROR and above from all of them
#
# Relative paths are resolved against the scheduler folder, so the
# default keeps logs with the code and they travel with it. Give an
# absolute path (e.g. /var/log/tms-scheduler) to put them wherever
# this box keeps logs.
#
# Environment: SCHEDULER_LOG_DIR
dir = logs

# Files rotate at midnight and are gzipped; this many days are kept.
# Environment: SCHEDULER_LOG_RETENTION_DAYS
retention_days = 30

# DEBUG / INFO / WARNING / ERROR.
# Environment: SCHEDULER_LOG_LEVEL
level = INFO

# Also print to stdout. On by default because cron mails whatever a
# job prints, which is how an operator finds out something broke.
# Turn it off when the crontab already redirects output to a file.
# Environment: SCHEDULER_LOG_CONSOLE
console = true
